name: 시황 카톡 브리핑

# 정기 발송은 로컬 Mac crontab(07/12/21시 KST)에서 수행합니다.
#   → run_brief.sh 참고. GitHub Actions cron 은 1~4시간 지연·누락이 잦아 제거함(v0.1.3).
# 이 워크플로는 수동 실행(workflow_dispatch) 전용 백업입니다.
on:
  workflow_dispatch:        # 수동 실행(백업·테스트)용
    inputs:
      slot:
        description: "발송 시점"
        required: false
        default: "evening"
        type: choice
        options: [morning, noon, evening]

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r market_brief/requirements.txt

      - name: 슬롯 결정
        id: slot
        run: echo "slot=${{ github.event.inputs.slot || 'evening' }}" >> "$GITHUB_OUTPUT"

      - name: 시황 브리핑 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python -m market_brief.main --slot "${{ steps.slot.outputs.slot }}"
