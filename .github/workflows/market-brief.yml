name: 공모전 카톡 브리핑
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "발송 시점"
        required: false
        default: "morning"
        type: choice
        options: [morning, afternoon, noon, evening]

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r market_brief/requirements.txt

      - name: 슬롯 결정
        id: slot
        run: echo "slot=${{ github.event.inputs.slot || 'evening' }}" >> "$GITHUB_OUTPUT"

      - name: 시황 브리핑 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python -m market_brief.main --slot "${{ steps.slot.outputs.slot }}"
